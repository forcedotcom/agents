name: tests
on:
  # One run per PR commit, fork PRs included. Fork PRs get no secrets, so they skip the NUTs.
  pull_request:
  # The merge queue runs everything, NUTs included, on the PR merged into main, with secrets,
  # after a maintainer queues it.
  merge_group:
  # After each merge, main reruns everything, NUTs included.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  yarn-lockfile-check:
    uses: salesforcecli/github-workflows/.github/workflows/lockFileCheck.yml@main
  # The Linux, Windows and macOS unit tests run in parallel.
  linux-unit-tests:
    needs: yarn-lockfile-check
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsLinux.yml@main
  windows-unit-tests:
    needs: yarn-lockfile-check
    uses: salesforcecli/github-workflows/.github/workflows/unitTestsWindows.yml@main
  # The shared workflows have no macOS unit tests, so run them here on the current Node LTS.
  macos-unit-tests:
    needs: yarn-lockfile-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: salesforcecli/github-workflows/.github/actions/setupNodeAndInstall@7a73e06604a17eb64a77792d30386f3357335d01 # main
        with:
          node-version: lts/*
          package-manager: yarn
          cache-dependency-path: yarn.lock
          install-command: yarn install --network-timeout 600000
      - name: Build
        run: yarn build
      - name: Test
        uses: salesforcecli/github-workflows/.github/actions/retry@7a73e06604a17eb64a77792d30386f3357335d01 # main
        with:
          command: yarn test
        env:
          SF_DISABLE_TELEMETRY: true
  # One check name for branch protection to require: `unit-tests`. The per-job unit-test checks
  # embed the Node version, so their names change with each Node release.
  unit-tests:
    needs: [yarn-lockfile-check, linux-unit-tests, windows-unit-tests, macos-unit-tests]
    # GitHub counts a skipped job as passing, so run even when a needed job failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job didn't succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
  nuts:
    needs: linux-unit-tests
    # NUTs need org secrets, which GitHub doesn't pass to fork PRs.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    uses: salesforcecli/github-workflows/.github/workflows/nut.yml@main
    secrets: inherit
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    with:
      os: ${{ matrix.os }}

  xNuts-plugin-agent:
    needs: linux-unit-tests
    # NUTs need org secrets, which GitHub doesn't pass to fork PRs.
    if: ${{ !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        command:
          - 'yarn test:nuts'
    uses: salesforcecli/github-workflows/.github/workflows/externalNut.yml@main
    with:
      packageName: '@salesforce/agents'
      externalProjectGitUrl: 'https://github.com/salesforcecli/plugin-agent'
      command: ${{matrix.command}}
      os: ${{matrix.os}}
      useCache: false
    secrets: inherit
  # One NUT check for branch protection and the merge queue to require: `nut-tests`. It's skipped
  # on fork PRs, which GitHub counts as passing; the merge queue runs their NUTs before merge.
  nut-tests:
    needs: [nuts, xNuts-plugin-agent]
    if: always() && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a needed job didn't succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | select(.value.result != "success") | "::error::\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
